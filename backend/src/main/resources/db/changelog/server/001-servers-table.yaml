databaseChangeLog:
  - changeSet:
      id: 001
      author: admin
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS server_schema;

        - createTable:
            tableName: servers
            schemaName: server_schema
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: creator_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: icon_url
                  type: text
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamptz