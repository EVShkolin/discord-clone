databaseChangeLog:
  - changeSet:
      id: 002
      author: admin
      changes:
        - createTable:
            tableName: channels
            schemaName: server_schema
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: server_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(20)
                  defaultValue: 'text'
                  constraints:
                    nullable: false
              - column:
                  name: user_limit
                  type: int
                  defaultValue: '0'
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamptz

        - addForeignKeyConstraint:
            referencedTableName: servers
            referencedTableSchemaName: server_schema
            referencedColumnNames: id
            baseTableName: channels
            baseTableSchemaName: server_schema
            baseColumnNames: server_id
            constraintName: fk_channels_servers
            onDelete: cascade

        - sql:
            sql: |
              ALTER TABLE server_schema.channels
              ADD CONSTRAINT chk_type
              CHECK (type IN ('text', 'voice'));

              ALTER TABLE server_schema.channels
              ADD CONSTRAINT chk_user_limit
              CHECK (user_limit BETWEEN 0 AND 99);