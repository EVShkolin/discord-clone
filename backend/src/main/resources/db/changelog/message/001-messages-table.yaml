databaseChangeLog:
  - changeSet:
      id: 001
      author: admin
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS message_schema;

        - createTable:
            tableName: messages
            schemaName: message_schema
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: content
                  type: text
              - column:
                  name: type
                  type: varchar(20)
                  defaultValue: 'TEXT'
                  constraints:
                    nullable: false
              - column:
                  name: channel_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamptz

        - sql:
            sql: |
              ALTER TABLE message_schema.messages
              ADD CONSTRAINT chk_type
              CHECK (type IN ('TEXT', 'VOICE', 'STICKER'));
              
              ALTER TABLE message_schema.messages
              ADD CONSTRAINT chk_not_empty_text_message
              CHECK ( NOT (type = 'TEXT' AND (content IS NULL OR content = '')) );