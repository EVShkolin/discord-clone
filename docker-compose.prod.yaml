services:
  app-db:
    image: postgres:17
    container_name: app-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p 5432" ]
      interval: 5s
      timeout: 10s
      retries: 20

  app-backend:
    image: ghcr.io/${GIT_REPOSITORY}/backend:latest
    container_name: app-backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      app-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 5s
      timeout: 10s
      retries: 20

  app-frontend:
    image: ghcr.io/${GIT_REPOSITORY}/frontend:latest
    container_name: app-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network
    depends_on:
      app-backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge