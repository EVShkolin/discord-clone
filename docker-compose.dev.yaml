services:
  app-db:
    image: postgres:17
    container_name: app-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: discord_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432"]
      interval: 5s
      timeout: 10s
      retries: 20

  app-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-backend
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: app-db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      SERVER_URL: http://localhost:3000
    depends_on:
      app-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 10s
      retries: 20

  app-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app-frontend
    ports:
      - "3000:80"
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf
    depends_on:
      app-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 5s
      timeout: 10s
      retries: 20

  mediasoup:
    build:
      context: ./mediasoup
      dockerfile: Dockerfile
    container_name: mediasoup
    ports:
      - "4000:4000"
      - "2000-2020:2000-2020/udp"
      - "2000-2020:2000-2020/tcp"
    env_file:
      - .env

volumes:
  pg_data: