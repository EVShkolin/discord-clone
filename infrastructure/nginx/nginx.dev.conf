user  root;
worker_processes  1;

events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen       80;
        server_name  example.com;

        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://host.docker.internal:8081;
        }

    }

}
